name: Sync WM 2026 Results

on:
  schedule:
    # Alle 15 Min in den Spielfenstern (16:00–06:00 UTC = 18:00–08:00 CEST).
    # OpenLigaDB wird community-gepflegt → Updates kommen verzögert, minütliches Pollen bringt nichts.
    - cron: '*/15 16-23 * * *'
    - cron: '*/15 0-6  * * *'
  workflow_dispatch:  # manueller Trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Run sync
        run: node scripts/sync-results.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
