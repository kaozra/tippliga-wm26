name: Sync WM 2026 Results

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-results.mjs'
      - 'scripts/sync-results.test.mjs'
      - 'src/fifa-results.js'
      - '.github/workflows/sync-results.yml'
  schedule:
    # Alle 5 Minuten in den WM-Spielfenstern (UTC). Die Datumsgrenzen verhindern,
    # dass der einmalige Turnier-Sync nach dem Finale dauerhaft weiterläuft.
    - cron: '*/5 16-23 28-30 6 *'
    - cron: '*/5 0-5 28-30 6 *'
    - cron: '*/5 16-23 1-19 7 *'
    - cron: '*/5 0-5 1-20 7 *'
    # Täglicher Vollabgleich gegen FIFA korrigiert auch nachträgliche
    # offizielle Resultatänderungen, ohne Firestore-Lesezugriffe zu verbrauchen.
    - cron: '17 6 11-30 6 *'
    - cron: '17 6 1-20 7 *'
  workflow_dispatch:  # manueller Trigger

permissions:
  contents: read

concurrency:
  group: sync-wm-2026-results
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SYNC_MODE: ${{ github.event_name == 'schedule' && startsWith(github.event.schedule, '*/5') && 'live' || 'full' }}
      ALLOW_SYNC_FAILURE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install locked dependencies
        run: npm ci --omit=dev --prefix scripts

      - name: Sync fixtures, live scores and results
        run: |
          for attempt in 1 2 3; do
            npm run sync:results && exit 0
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          exit 1
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
