name: Test app rules

on:
  push:
    branches: [main]
    paths:
      - 'src/scoring.js'
      - 'src/scoring.test.js'
      - 'src/bracket.js'
      - 'src/bracket.test.js'
      - '.github/workflows/test-scoring.yml'
  pull_request:
    paths:
      - 'src/scoring.js'
      - 'src/scoring.test.js'
      - 'src/bracket.js'
      - 'src/bracket.test.js'
      - '.github/workflows/test-scoring.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scoring rules
        run: npm run test:scoring
      - name: Verify bracket progression
        run: npm run test:bracket
